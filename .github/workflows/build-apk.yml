name: Build Rude Organic Maps APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout Organic Maps
        uses: actions/checkout@v4
        with:
          repository: organicmaps/organicmaps
          ref: 3ef379196cca434cf17f4ee684f16aa99fd8985e
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache

      - name: Checkout Organic Maps submodules
        run: |
          git submodule update \
            --depth 1 \
            --init \
            --recursive \
            --jobs=$(( $(nproc) * 4 ))

      - name: Checkout Rude-Sat-Nav files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: rude-sat-nav
          sparse-checkout: |
            rude-navigation.patch
          sparse-checkout-cone-mode: false

      - name: Verify Rude-Sat-Nav patch
        run: |
          set -e

          echo "===== Rude-Sat-Nav checkout ====="
          find rude-sat-nav -type f -print

          echo "===== Checking patch ====="
          test -f rude-sat-nav/rude-navigation.patch

          echo "===== Patch size ====="
          ls -lh rude-sat-nav/rude-navigation.patch

      - name: Check patch before applying
        run: |
          set -e

          echo "===== CHECKING PATCH ====="
          git apply --check rude-sat-nav/rude-navigation.patch

          echo "Patch applies cleanly to Organic Maps commit:"
          git rev-parse HEAD

      - name: Apply Rude-Sat-Nav patch
        run: |
          set -e

          echo "===== APPLYING RUDE-SAT-NAV PATCH ====="
          git apply rude-sat-nav/rude-navigation.patch

          echo "===== MODIFIED FILES ====="
          git status --short

          echo "===== VERIFY RUDE TTS ====="
          grep -n "RudeTts.transform" \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/TtsPlayer.java

          echo "===== VERIFY RUDE TTS FILE ====="
          test -f \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java

          echo "===== VERIFY DRIVING MONITOR ====="
          test -f \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeDrivingMonitor.java

          echo "===== VERIFY DRIVER NAME SETTING ====="
          grep -R -n "mTtsDriverName" \
            android/app/src/main/java/app/organicmaps/settings/ \
            || true

      - name: Build ARM64 Google Debug APK
        working-directory: android
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            -Parchitectures=arm64-v8a \
            assembleGoogleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Show APK outputs
        if: always()
        run: |
          echo "===== APK FILES ====="

          find android/app/build \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo "===== OUTPUT DIRECTORY ====="

          find android/app/build/outputs \
            -type f \
            -print 2>/dev/null || true

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rude-organic-maps-google-debug
          path: |
            android/app/build/outputs/**
            gradle-build.log
          if-no-files-found: warn
          retention-days: 30
