name: Build Rude Organic Maps APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout Organic Maps
        uses: actions/checkout@v4
        with:
          repository: organicmaps/organicmaps
          ref: 3ef379196cca434cf17f4ee684f16aa99fd8985e
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache

      - name: Checkout Organic Maps submodules
        run: |
          git submodule update --depth 1 --init --recursive --jobs=$(( $(nproc) * 4 ))

      - name: Checkout Rude-Sat-Nav files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: rude-sat-nav
          sparse-checkout: |
            rude-navigation.patch
            android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java
          sparse-checkout-cone-mode: false

      - name: Apply Rude Navigation changes
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/rude-sat-nav/rude-navigation.patch"
          RUDE_TTS="$GITHUB_WORKSPACE/rude-sat-nav/android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java"

          echo "===== CHECKING PATCH ====="
          git apply --check \
            --exclude='android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java' \
            "$PATCH"

          echo "===== APPLYING PATCH ====="
          git apply \
            --exclude='android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java' \
            "$PATCH"

          echo "===== INSTALLING RudeTts.java ====="
          test -f "$RUDE_TTS"

          mkdir -p android/sdk/src/main/java/app/organicmaps/sdk/sound

          cp "$RUDE_TTS" \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java

          echo "===== VERIFYING RudeTts.java ====="
          test -f android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java

          echo "===== VERIFYING TtsPlayer.java ====="
          grep -n "RudeTts.transform" \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/TtsPlayer.java

          echo "===== VERIFYING CONFIG ====="
          grep -n "isRudeEnabled" \
            android/sdk/src/main/java/app/organicmaps/sdk/util/Config.java

          echo "===== VERIFYING SETTINGS ====="
          grep -n "mTtsRude" \
            android/app/src/main/java/app/organicmaps/settings/VoiceInstructionsSettingsFragment.java

          echo "===== RudeTts.java HEADER ====="
          head -n 10 \
            android/sdk/src/main/java/app/organicmaps/sdk/sound/RudeTts.java

          echo "===== MODIFIED FILES ====="
          git status --short

      - name: Build ARM64 Google Debug APK
        working-directory: android
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            -Parchitectures=arm64-v8a \
            assembleGoogleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Show APK outputs
        if: always()
        run: |
          echo "===== APK FILES ====="
          find android/app/build \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo "===== ALL OUTPUT FILES ====="
          find android/app/build/outputs \
            -type f \
            -print 2>/dev/null || true

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rude-organic-maps-build
          path: |
            android/app/build/outputs/**
            gradle-build.log
          if-no-files-found: warn
          retention-days: 30
